# Runs owi next to an Open Wearables stack and reaches its API over that stack's network.
# Start from the repository root:
#   docker compose --env-file .env -f docker/compose.yml up -d --build
name: owi

x-runtime: &runtime
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Recomputes the last 14 days every 10 minutes and tunes the estimates on the entries.
  owi:
    <<: *runtime
    image: owi:${OWI_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OWI_BUILD_REVISION: ${OWI_BUILD_REVISION:-development}
    init: true
    env_file:
      - ../.env
    environment:
      OWI_API_URL: ${OWI_DOCKER_API_URL:-http://app:8000}
      OWI_DATA_DIR: /data
    volumes:
      # Shared with the host so `owi calibrate` and `owi day` see the same files.
      - ../data:/data
    networks:
      - openwearables
    healthcheck:
      test: ["CMD", "python", "-m", "owi.health", "sync"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 300s

  # HTTP API for the web. It gets the results, its two tokens and nothing else: no Open
  # Wearables key and no access to that stack's network. It reads the results and writes
  # only the accounts (data/accounts) and the Samsung Health entries (data/zapisy); both
  # folders are created by owi sync and owi serve.
  api:
    <<: *runtime
    image: owi:${OWI_IMAGE_TAG:-local}
    command: ["owi", "serve", "--host", "0.0.0.0", "--port", "8787"]
    init: true
    environment:
      OWI_SERVE_TOKEN: ${OWI_SERVE_TOKEN:?set OWI_SERVE_TOKEN in .env and pass --env-file .env}
      # Without it the API stays read-only and entries answer 503.
      OWI_WRITE_TOKEN: ${OWI_WRITE_TOKEN:-}
      OWI_TIMEZONE: ${OWI_TIMEZONE:-Europe/Bratislava}
      OWI_DATA_DIR: /data
    volumes:
      - ../data:/data:ro
      - ../data/accounts:/data/accounts
      - ../data/zapisy:/data/zapisy
    ports:
      # Local only; a reverse proxy (Tailscale Funnel) publishes it over HTTPS.
      - "127.0.0.1:${OWI_SERVE_PORT:-8787}:8787"
    depends_on:
      - owi
    healthcheck:
      test: ["CMD", "python", "-m", "owi.health", "api"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

networks:
  openwearables:
    external: true
    name: ${OW_NETWORK:-open-wearables_default}
